context:
  version: "2.2.0"

package:
  name: vecgeom
  version: ${{ version }}

source:
  url: https://gitlab.cern.ch/VecGeom/VecGeom/-/archive/v${{ version }}/VecGeom-v${{ version }}.tar.gz
  sha256: 885b293a82cd3c80221e0aa2b8b5ca1b6c336abcd4b6756a2bad6e3ed4543493

build:
  script:
    - cmake -S . -B build -G Ninja -DCUDA=OFF -DBACKEND=Vc -DBENCHMARK=OFF -DBUILTIN_VECCORE=OFF -DBUILD_TESTING=ON -DBUILD_DOC=OFF -DVECGEOM_GDML=OFF ${CMAKE_ARGS}
    - cmake build -LH
    - cmake --build build --parallel ${CPU_COUNT}
    # As of now, we build on native runners (linux-aarch64 + macOS-arm64), so this recipe doesn't cross-compile.
    # If cross-compiling for additional architectures in future, use ${CONDA_BUILD_CROSS_COMPILATION:-} check to allow tests to run in emulation.
    - if: osx
      then: ctest --test-dir build --output-on-failure --verbose -E "create_geometry|AssemblyTest|TestGeoManager"
      else: ctest --test-dir build --output-on-failure --verbose
    - cmake --install build
  number: 0
  skip:
    - win

requirements:
  build:
    - ${{ compiler("cxx") }}
    - ${{ stdlib("c") }}
    - cmake
    - ninja
  host:
    - veccore
  run_exports:
    - ${{ pin_subpackage("vecgeom", upper_bound="x.x") }}
tests:
  - package_contents:
      lib:
        - vecgeom
      include:
        - VecGeom/*
      files:
        - lib/cmake?VecGeom/*
      strict: true

about:
  homepage: https://gitlab.cern.ch/VecGeom/VecGeom
  summary: 'A geometry modeller library with hit-detection features - VecGeom'
  description: |
    VecGeom is a geometry modeller library with hit-detection features as needed by particle detector simulation at the LHC and beyond.
    It was incubated by a Geant-R&D initiative and the motivation to combine the code of Geant4 and ROOT/TGeo into a single, better
    maintainable piece of software within the EU-AIDA program.
  license: Apache-2.0
  license_file: LICENSE.txt
  repository: https://gitlab.cern.ch/VecGeom/VecGeom

extra:
  recipe-maintainers:
    - utk4r-sh
    - GiacomoXT
    - vvsagar
    - AlexanderHeidelbach
